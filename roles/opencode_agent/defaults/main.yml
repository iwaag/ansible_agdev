---
# Keep the OpenCode runtime reproducible.  The archive checksums are the
# GitHub release-asset SHA-256 values for v1.18.10.
opencode_agent_version: "1.18.10"
opencode_agent_archives:
  Darwin-arm64:
    filename: opencode-darwin-arm64.zip
    sha256: 641fe2e65e42db76c2d32db5f85573c3682a8c72f82d01568a922a8feccc4658
  Darwin-x86_64:
    filename: opencode-darwin-x64.zip
    sha256: b2d9e161b3c6f398ab8a21a129455550c7b79b68579bb542dbc986f10b084ae4
  Linux-x86_64:
    filename: opencode-linux-x64.tar.gz
    sha256: 6b1113da704253fb4da12b41e4236acecb9f2b62949c945f6eeacaa15111b976
  Linux-aarch64:
    filename: opencode-linux-arm64.tar.gz
    sha256: 41ae3041e91b894e4c0dc06a73a9a2796254bf390ffb99626a43af5e2912d170

opencode_agent_user: "{{ ansible_user | default('eiji') }}"
opencode_agent_serve: true
opencode_agent_port: 4096
opencode_agent_listen: 127.0.0.1
opencode_agent_workdir: "{{ ansible_facts['env']['HOME'] }}/agent-work"
# The playbook supplies this from nctl's desired-service dependency resolver.
# A loopback default would hide missing cluster intent on newly added nodes.
opencode_agent_ollama_url: ""
opencode_agent_model: qwen3.6:35b-a3b-coding-nvfp4
