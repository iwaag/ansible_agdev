---
# One row per active nfs_server placement on this host (nctl render
# production). Keys are the profile's ansible variables.
nfs_server_exports: []
# Options every Linux export gets before a placement's own `options`.
# all_squash maps every client user to the share owner, so hosts whose users
# have different uids (macOS 501, Linux 1000) read and write as one owner.
# macOS expresses the same squash with the per-placement `-mapall=` flag
# built in tasks/macos.yml (exports(5) has no equivalent of this base list).
nfs_server_base_options:
  - rw
  - sync
  - no_subtree_check
  - all_squash
# Only files/blocks this role wrote are ever replaced or removed: on Linux
# one file per placement under this directory; on macOS one marked block
# per placement inside /etc/exports (there is no exports.d equivalent).
nfs_server_exports_dir: /etc/exports.d
nfs_server_file_prefix: nintent-
