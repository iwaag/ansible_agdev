---
- name: Validate the NFS export contract
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] in ['Linux', 'Darwin']
      - ansible_facts['system'] == 'Darwin' or ansible_facts['os_family'] == 'Debian'
      - nfs_server_exports | map(attribute='instance_name') | unique | list | length == nfs_server_exports | length
      - nfs_server_exports | map(attribute='nfs_server_path') | unique | list | length == nfs_server_exports | length
      - item.instance_name is match('^[a-z0-9]+(?:[-_][a-z0-9]+)*$')
      - item.nfs_server_path is match('^/[^\s]+$')
      - item.nfs_server_path not in ['/', '/etc', '/home', '/root', '/usr', '/var']
      - item.nfs_server_clients | length > 0
      - item.nfs_server_anon_uid | int > 0
      - item.nfs_server_anon_gid | int > 0
    fail_msg: "Invalid nfs_server placement {{ item.instance_name | default('unknown') }} (Linux must be Debian-family)"
  loop: "{{ nfs_server_exports }}"
  loop_control:
    label: "{{ item.instance_name | default('unknown') }}"

- name: Export on Linux
  ansible.builtin.include_tasks: linux.yml
  when: ansible_facts['system'] == 'Linux'

- name: Export on macOS
  ansible.builtin.include_tasks: macos.yml
  when: ansible_facts['system'] == 'Darwin'
