---
# One row per active nfs_client placement on this host (nctl render
# production). Keys are the profile's ansible variables.
nfs_client_mounts: []
# Mount options before a placement's own `options`. Linux mounts through a
# systemd automount (mounted on first access, also after a reboot or a server
# outage); macOS through the automounter's direct map. `resvport` lets the
# macOS client use a privileged source port, which the Linux server requires
# by default.
nfs_client_linux_base_options:
  - rw
  - hard
  - nofail
  - _netdev
  - x-systemd.automount
  - x-systemd.mount-timeout=30
nfs_client_macos_base_options:
  - rw
  - resvport
  - hard
  - vers=3
# macOS allows only one master-map entry per mountpoint (auto_master(5)), and
# the stock default already claims the direct-map mountpoint "/-" for the
# built-in "-static" map, which synthesizes direct-map entries from fstab(5)
# (entries without the "net" option) instead of taking it over, this role
# declares its mounts in fstab and lets "-static" pick them up — so the
# stock "/-" line, and any other entries already in fstab, are left alone.
# Overridable so this is exercised against a scratch file.
nfs_client_macos_fstab: /etc/fstab
# Where a pre-fix version of this role (develop/run-002 and earlier) wrote
# its own direct map and "/-" master-map line; only used to tidy those away
# on a host that still carries them. Overridable so that cleanup is
# exercised against scratch files.
nfs_client_macos_map_legacy: /etc/auto_nintent
nfs_client_macos_master: /etc/auto_master
# The user whose access is verified after mounting (the login user that
# agents and services run as).
nfs_client_verify_user: "{{ ansible_user | default(default_user) }}"
