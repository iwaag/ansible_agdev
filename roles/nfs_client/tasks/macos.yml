---
- name: Ensure each mount point's parent exists
  ansible.builtin.file:
    path: "{{ item.nfs_client_path | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ nfs_client_mounts }}"
  loop_control:
    label: "{{ item.instance_name }}"

- name: Write the direct map this role owns
  ansible.builtin.template:
    src: auto_nintent.j2
    dest: "{{ nfs_client_macos_map }}"
    owner: root
    group: wheel
    mode: "0644"
  register: nfs_client_map
  notify: Reload the macOS automounter

- name: Reference the map from auto_master (other entries are left alone)
  ansible.builtin.lineinfile:
    path: /etc/auto_master
    regexp: '^/-\s+{{ nfs_client_macos_map | basename }}(\s|$)'
    line: "/-\t\t\t{{ nfs_client_macos_map | basename }}\t-nosuid"
    backup: true
  notify: Reload the macOS automounter

- name: Drop mounts whose map entry changed, so the new options apply on next access
  ansible.builtin.command:
    argv: [umount, "{{ item.nfs_client_path }}"]
  loop: "{{ nfs_client_mounts }}"
  loop_control:
    label: "{{ item.instance_name }}"
  when: nfs_client_map.changed
  register: nfs_client_umount
  changed_when: nfs_client_umount.rc == 0
  failed_when: false

- name: Apply automounter changes now
  ansible.builtin.meta: flush_handlers
