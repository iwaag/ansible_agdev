---
- name: Deploy the agautolab checkout and optional listener through agag_agent
  ansible.builtin.include_role:
    name: agag_agent
  vars:
    agag_agent_repo_url: "{{ autolab_node_repo_url }}"
    agag_agent_repo_version: "{{ autolab_node_repo_version }}"
    agag_agent_repo_dest: "{{ autolab_node_repo_dest }}"
    agag_agent_agent: agautolab
    agag_agent_instance_name: "{{ autolab_node_instance_name }}"
    agag_agent_listener_enabled: "{{ autolab_node_zulip_listener }}"
    agag_agent_zulip_credentials_source: "{{ autolab_node_zulip_credentials_source }}"
    agag_agent_plane_credentials_source: "{{ autolab_node_plane_credentials_source }}"
    agag_agent_anthropic_api_key_source: "{{ autolab_node_anthropic_api_key_source }}"
    agag_agent_claude_code_command: "{{ autolab_node_claude_code_command }}"
    agag_agent_uv_command: "{{ autolab_node_uv_command }}"
    agag_agent_provider_ollama_base_url: "{{ autolab_node_provider_ollama_base_url }}"
    agag_agent_role_profiles:
      front: "{{ autolab_node_front_profile }}"
      director: "{{ autolab_node_director_profile }}"
      mediator: "{{ autolab_node_mediator_profile }}"
      coding: "{{ autolab_node_coding_profile }}"
      summarizer: "{{ autolab_node_summarizer_profile }}"

- name: Deploy the autolab-only gateway surface
  ansible.builtin.include_role:
    name: autolab_gateway
