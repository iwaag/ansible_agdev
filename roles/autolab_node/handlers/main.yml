---
- name: Restart autolab-gateway
  ansible.builtin.systemd_service:
    name: autolab-gateway.service
    scope: user
    daemon_reload: true
    state: restarted

- name: Restart autolab-zulip
  ansible.builtin.systemd_service:
    name: autolab-zulip.service
    scope: user
    daemon_reload: true
    state: restarted
