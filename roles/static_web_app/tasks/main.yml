---
- name: Validate static web app instance contract
  ansible.builtin.assert:
    that:
      - static_web_app_instances | length > 0
      - static_web_app_instances | map(attribute='instance_name') | unique | list | length == static_web_app_instances | length
      - item.instance_name is match('^[a-z0-9]+(?:[-_][a-z0-9]+)*$')
      - item.static_web_app_repo_url is match('^http://agstudio\\.local:3000/autodev/[a-z0-9_-]+\\.git$')
      - item.static_web_app_port | int > 0
      - item.static_web_app_port | int < 65536
      - item.static_web_app_run_state | default('started') in ['started', 'stopped']
    fail_msg: "Invalid static_web_app placement config for {{ item.instance_name | default('unknown') }}"
  loop: "{{ static_web_app_instances }}"
  loop_control:
    label: "{{ item.instance_name | default('unknown') }}"

- name: Ensure static web app roots exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ static_web_app_root }}"
    - "{{ static_web_app_state_root }}"

- name: Clone or update static web app content
  ansible.builtin.git:
    repo: "{{ item.static_web_app_repo_url }}"
    dest: "{{ static_web_app_root }}/{{ item.instance_name }}"
    version: "{{ item.static_web_app_repo_version | default('main') }}"
    update: true
  loop: "{{ static_web_app_instances }}"
  loop_control:
    label: "{{ item.instance_name }}"

- name: Converge static web app process state
  ansible.builtin.shell: |
    set -eu
    pid_file={{ (static_web_app_state_root ~ '/' ~ item.instance_name ~ '.pid') | quote }}
    log_file={{ (static_web_app_state_root ~ '/' ~ item.instance_name ~ '.log') | quote }}
    if [ -f "$pid_file" ]; then
      old_pid="$(sed -n '1p' "$pid_file")"
      if [ -n "$old_pid" ] && kill -0 "$old_pid" 2>/dev/null; then
        kill "$old_pid"
        for wait_count in 1 2 3 4 5; do
          kill -0 "$old_pid" 2>/dev/null || break
          sleep 1
        done
      fi
      rm -f "$pid_file"
      echo changed
    fi
    if [ {{ (item.static_web_app_run_state | default('started')) | quote }} = started ]; then
      nohup {{ ansible_facts['python']['executable'] | quote }} -m http.server \
        {{ item.static_web_app_port | int }} --bind 0.0.0.0 \
        --directory {{ (static_web_app_root ~ '/' ~ item.instance_name) | quote }} \
        >>"$log_file" 2>&1 </dev/null &
      echo "$!" > "$pid_file"
      echo changed
    fi
  args:
    executable: /bin/sh
  register: static_web_app_process
  changed_when: "'changed' in static_web_app_process.stdout"
  loop: "{{ static_web_app_instances }}"
  loop_control:
    label: "{{ item.instance_name }} -> {{ item.static_web_app_run_state | default('started') }}"

- name: Wait for started static web app ports
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item.static_web_app_port }}"
    state: started
    timeout: 15
  when: item.static_web_app_run_state | default('started') == 'started'
  loop: "{{ static_web_app_instances }}"
  loop_control:
    label: "{{ item.instance_name }}:{{ item.static_web_app_port }}"

- name: Probe started static web apps over HTTP
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.static_web_app_port }}/"
    status_code: 200
  when: item.static_web_app_run_state | default('started') == 'started'
  loop: "{{ static_web_app_instances }}"
  loop_control:
    label: "{{ item.instance_name }}:{{ item.static_web_app_port }}"

- name: Confirm stopped static web app ports are closed
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item.static_web_app_port }}"
    state: stopped
    timeout: 15
  when: item.static_web_app_run_state | default('started') == 'stopped'
  loop: "{{ static_web_app_instances }}"
  loop_control:
    label: "{{ item.instance_name }}:{{ item.static_web_app_port }}"
