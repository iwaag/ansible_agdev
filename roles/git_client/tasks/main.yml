---
- name: Assert git_client role supports this operating system
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
    fail_msg: >-
      git_client role supports Linux hosts only.
      Got ansible_system={{ ansible_system }}.

- name: Check whether Git is already installed
  ansible.builtin.command:
    cmd: git --version
  register: git_client_version
  changed_when: false
  failed_when: false

- name: Refresh APT package cache before installing Git
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when:
    - git_client_version.rc != 0
    - ansible_pkg_mgr == "apt"

- name: Install Git packages
  ansible.builtin.package:
    name: "{{ git_client_packages }}"
    state: present
  when: git_client_version.rc != 0
