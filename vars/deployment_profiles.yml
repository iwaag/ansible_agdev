---
# Ansible-owned production inventory projection contract.
# This file must not contain secrets. Profile and config keys are lowercase
# slugs; config schema 1 accepts only the explicitly declared JSON types.
deployment_profiles:
  dnsmasq:
    group: dnsmasq_server
    config_schema_version: "1"
    variables:
      bind_interfaces:
        ansible_variable: dnsmasq_bind_interfaces
        type: boolean
        required: false
      cache_size:
        ansible_variable: dnsmasq_cache_size
        type: integer
        required: false
      dhcp_authoritative:
        ansible_variable: dnsmasq_dhcp_authoritative
        type: boolean
        required: false
      enable_dhcp:
        ansible_variable: dnsmasq_enable_dhcp
        type: boolean
        required: false
      interfaces:
        ansible_variable: dnsmasq_interfaces
        type: list
        items: string
        required: false
      listen_addresses:
        ansible_variable: dnsmasq_listen_addresses
        type: list
        items: string
        required: false
      local_domain:
        ansible_variable: dnsmasq_local_domain
        type: string
        required: false
      upstream_servers:
        ansible_variable: dnsmasq_upstream_servers
        type: list
        items: string
        required: false

  grafana:
    group: grafana_server
    config_schema_version: "1"
    variables:
      datasource_is_default:
        ansible_variable: grafana_datasource_is_default
        type: boolean
        required: false
      datasource_name:
        ansible_variable: grafana_datasource_name
        type: string
        required: false
      datasource_provisioning_enabled:
        ansible_variable: grafana_datasource_provisioning_enabled
        type: boolean
        required: false
      prometheus_port:
        ansible_variable: grafana_prometheus_port
        type: integer
        required: false
      prometheus_scheme:
        ansible_variable: grafana_prometheus_scheme
        type: string
        required: false

  nomad_client:
    group: nomad_client
    config_schema_version: "1"
    variables:
      datacenter:
        ansible_variable: nomad_datacenter
        type: string
        required: false
      node_class:
        ansible_variable: nomad_client_node_class
        type: string
        required: false
      raw_exec_enabled:
        ansible_variable: nomad_raw_exec_enabled
        type: boolean
        required: false
      region:
        ansible_variable: nomad_region
        type: string
        required: false

  nomad_server:
    group: nomad_server
    config_schema_version: "1"
    variables:
      bootstrap_expect:
        ansible_variable: nomad_bootstrap_expect
        type: integer
        required: false
      datacenter:
        ansible_variable: nomad_datacenter
        type: string
        required: false
      region:
        ansible_variable: nomad_region
        type: string
        required: false
      retry_join:
        ansible_variable: nomad_server_retry_join
        type: list
        items: string
        required: false

  prometheus:
    group: prometheus_server
    config_schema_version: "1"
    variables:
      listen_address:
        ansible_variable: prometheus_listen_address
        type: string
        required: false
      retention_time:
        ansible_variable: prometheus_retention_time
        type: string
        required: false

  prometheus_node_exporter:
    group: prometheus_node_exporter_targets
    config_schema_version: "1"
    variables: {}

  manual_toolchain:
    group: manual_toolchains
    config_schema_version: "1"
    placement_list_variable: manual_toolchain_instances
    variables:
      process:
        ansible_variable: manual_toolchain_process
        type: string
        required: false
      process_pattern:
        ansible_variable: manual_toolchain_process_pattern
        type: string
        required: false

  cron_task:
    group: cron_task_hosts
    config_schema_version: "1"
    variables:
      script_path:
        ansible_variable: cron_task_script_path
        type: string
        required: true

  ollama:
    group: ollama_server
    config_schema_version: "1"
    variables: {}

  swarmui:
    group: swarmui_server
    config_schema_version: "1"
    variables:
      endpoint:
        ansible_variable: swarmui_endpoint
        type: string
        required: false

  comfyui:
    group: comfyui_server
    config_schema_version: "1"
    variables:
      endpoint:
        ansible_variable: comfyui_endpoint
        type: string
        required: false

  static_web_app:
    group: static_web_app_hosts
    config_schema_version: "1"
    placement_list_variable: static_web_app_instances
    variables:
      repo_url:
        ansible_variable: static_web_app_repo_url
        type: string
        required: true
      repo_version:
        ansible_variable: static_web_app_repo_version
        type: string
        required: false
      port:
        ansible_variable: static_web_app_port
        type: integer
        required: true
      run_state:
        ansible_variable: static_web_app_run_state
        type: string
        required: false

  agag_agent:
    group: agag_agents
    config_schema_version: "1"
    variables:
      agent:
        ansible_variable: agag_agent_agent
        type: string
        required: true
      instance_name:
        ansible_variable: agag_agent_instance_name
        type: string
        required: true
      provider_ollama_base_url:
        ansible_variable: agag_agent_provider_ollama_base_url
        type: string
        required: false
      repo_dest:
        ansible_variable: agag_agent_repo_dest
        type: string
        required: true
      repo_url:
        ansible_variable: agag_agent_repo_url
        type: string
        required: true
      repo_version:
        ansible_variable: agag_agent_repo_version
        type: string
        required: false
      role_profiles_toml:
        ansible_variable: agag_agent_role_profiles_toml
        type: string
        required: false

  # project_migration p7: a remote WFE execution node (agdevworld
  # workflow_editor/docs/workers.md). One placement per node of the
  # `agautolab` service; the coordinator's workers.json names the same id.
  # Token sources are controller-local files, never their contents.
  wfe_worker:
    group: wfe_workers
    config_schema_version: "1"
    variables:
      worker_id:
        ansible_variable: wfe_worker_id
        type: string
        required: true
      label:
        ansible_variable: wfe_worker_label
        type: string
        required: false
      coordinator:
        ansible_variable: wfe_worker_coordinator
        type: string
        required: true
      wfe_version:
        ansible_variable: wfe_worker_wfe_version
        type: string
        required: true
      executor_version:
        ansible_variable: wfe_worker_executor_version
        type: string
        required: true
      token_source:
        ansible_variable: wfe_worker_token_source
        type: string
        required: true
      gitea_url:
        ansible_variable: wfe_worker_gitea_url
        type: string
        required: true
      gitea_token_source:
        ansible_variable: wfe_worker_gitea_token_source
        type: string
        required: true
      shares:
        ansible_variable: wfe_worker_shares
        type: list
        items: string
        required: false
      display:
        ansible_variable: wfe_worker_display
        type: string
        required: false
      xauthority:
        ansible_variable: wfe_worker_xauthority
        type: string
        required: false
      godot_version:
        ansible_variable: wfe_worker_godot_version
        type: string
        required: false
      claude_code_version:
        ansible_variable: wfe_worker_claude_code_version
        type: string
        required: false
      agents_local_toml:
        ansible_variable: wfe_worker_agents_local_toml
        type: string
        required: false

  # project_migration p6: one shared area served by a Debian-family Linux
  # host and mounted by Linux and macOS clients. Physical paths live in
  # placement config, never in a project: projects name a logical share.
  nfs_server:
    group: nfs_servers
    config_schema_version: "1"
    placement_list_variable: nfs_server_exports
    variables:
      share:
        ansible_variable: nfs_server_share
        type: string
        required: true
      path:
        ansible_variable: nfs_server_path
        type: string
        required: true
      clients:
        ansible_variable: nfs_server_clients
        type: list
        items: string
        required: true
      anon_uid:
        ansible_variable: nfs_server_anon_uid
        type: integer
        required: true
      anon_gid:
        ansible_variable: nfs_server_anon_gid
        type: integer
        required: true
      mode:
        ansible_variable: nfs_server_mode
        type: string
        required: false
      options:
        ansible_variable: nfs_server_options
        type: list
        items: string
        required: false
      mount_require_resv_port:
        ansible_variable: nfs_server_mount_require_resv_port
        type: boolean
        required: false

  nfs_client:
    group: nfs_clients
    config_schema_version: "1"
    placement_list_variable: nfs_client_mounts
    variables:
      share:
        ansible_variable: nfs_client_share
        type: string
        required: true
      server:
        ansible_variable: nfs_client_server
        type: string
        required: true
      export:
        ansible_variable: nfs_client_export
        type: string
        required: true
      path:
        ansible_variable: nfs_client_path
        type: string
        required: true
      options:
        ansible_variable: nfs_client_options
        type: list
        items: string
        required: false

deployment_profile_reconciliation:
  dnsmasq:
    action:
      kind: dnsmasq_config
      managed_files:
        records:
          path: /etc/dnsmasq.d/nintent-records.conf
          digest: sha256

  grafana:
    action:
      kind: playbook
      playbook: playbooks/monitoring/setup_grafana.yml
    dependencies:
      - prometheus

  nomad_client:
    action:
      kind: playbook
      playbook_by_os:
        linux: playbooks/nomad/setup_nomad_client.yml
        macos: playbooks/nomad/setup_nomad_client_macos.yml
    dependencies:
      - nomad_server

  nomad_server:
    action:
      kind: playbook
      playbook: playbooks/nomad/setup_nomad_server.yml

  prometheus:
    action:
      kind: playbook
      playbook: playbooks/monitoring/setup_prometheus.yml

  prometheus_node_exporter:
    action:
      kind: playbook
      playbook: playbooks/monitoring/setup_node_exporter.yml
    dependencies:
      - prometheus

  manual_toolchain:
    observe_only: true

  cron_task:
    observe_only: true
    checks:
      - kind: file_exists
        path_from_config: script_path
      - kind: cron_registered
        path_from_config: script_path

  swarmui:
    observe_only: true
    checks:
      - kind: http
        paths: ["/"]
      - kind: file_exists
        path: "~/StabilityMatrix/Packages/SwarmUI"

  comfyui:
    observe_only: true
    checks:
      - kind: http
        paths: ["/"]
      - kind: file_exists
        path: "~/StabilityMatrix/Packages/ComfyUI"

  static_web_app:
    action:
      kind: playbook
      playbook_by_os:
        linux: playbooks/services/setup_static_web_app.yml
        macos: playbooks/services/setup_static_web_app_macos.yml
    checks:
      - kind: http
        paths: ["/"]
    run_state_from_config: run_state

  agag_agent:
    action:
      kind: playbook
      playbook: playbooks/agent/setup_agag_agent.yml
    checks:
      - kind: file_exists
        path_from_config: repo_dest



  ollama:
    observe_only: true
    checks:
      - kind: http
        paths: ["/v1/models", "/api/tags"]

  wfe_worker:
    action:
      kind: playbook
      playbook_by_os:
        linux: playbooks/services/setup_wfe_worker.yml
    checks:
      - kind: file_exists
        path: "~/wfe-worker/worker.json"

  nfs_server:
    action:
      kind: playbook
      playbook_by_os:
        linux: playbooks/services/setup_nfs_server.yml
        macos: playbooks/services/setup_nfs_server_macos.yml
    checks:
      - kind: nfs_export
        path_from_config: path

  nfs_client:
    action:
      kind: playbook
      playbook_by_os:
        linux: playbooks/services/setup_nfs_client.yml
        macos: playbooks/services/setup_nfs_client_macos.yml
    dependencies:
      - nfs_server
    checks:
      - kind: nfs_mount
        path_from_config: path
