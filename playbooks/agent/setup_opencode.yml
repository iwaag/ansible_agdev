---
- name: Install and repair the OpenCode node agent
  hosts: node_agent_hosts
  gather_facts: true
  become: false

  vars_files:
    - ../../vars/opencode_agent.yml

  vars:
    opencode_agent_ollama_url: >-
      {{ opencode_agent_ollama_urls[inventory_hostname]
         | default(opencode_agent_default_ollama_url) }}

  pre_tasks:
    - name: Require an explicit target limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | length > 0
        fail_msg: >-
          Select an intended node explicitly, for example: --limit agstudio.

  roles:
    - role: opencode_agent
