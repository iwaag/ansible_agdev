---
- name: Install and repair the OpenCode node agent
  hosts: node_agent_hosts
  gather_facts: true
  become: false

  vars:
    opencode_agent_ollama_url: "{{ nintent_opencode_ollama_url }}"

  pre_tasks:
    - name: Require an explicit target limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | length > 0
        fail_msg: >-
          Select an intended node explicitly, for example: --limit agstudio.

    - name: Require a resolved LLM provider endpoint from nctl inventory
      ansible.builtin.assert:
        that:
          - nintent_opencode_ollama_url is defined
          - nintent_opencode_ollama_url is string
          - nintent_opencode_ollama_url | length > 0
        fail_msg: >-
          This node-agent placement needs an LLM provider resolved from desired state.

  roles:
    - role: opencode_agent
