---
# Retire one agag agent instance from a node.
#
# The inverse of `setup_agag_agent.yml`, and the missing half of a retirement:
# removing a placement from desired state stops the *inventory* carrying the
# agent, so nothing redeploys it — but the systemd user unit it already
# installed stays enabled, and the next boot starts the listener again, which
# re-posts the introduction and puts a retired instance back on the board.
# `refactor` p3 ex1 met exactly that with the `agecho` fixture.
#
# What it does not do: delete the bot account, the Zulip channel, or the
# `intro-` topic's ✔. Retirement in this realm is a flag on the introduction
# plus the absence of a declaration; this playbook only makes the node agree.
#
#   ansible-playbook -i inventories/generated/production.yml \
#     playbooks/agent/retire_agag_agent.yml \
#     -e agag_agent_agent=agecho -e target=agautolab1
#
# `remove_checkout=true` also deletes the repository checkout. Off by default:
# the checkout holds the instance's ignored credentials and run records, and
# a stopped unit is reversible while a deleted directory is not.
- name: Retire an agag agent instance
  hosts: "{{ target }}"
  gather_facts: true
  vars:
    remove_checkout: false
    agag_agent_repo_dest: "{{ ansible_facts['env']['HOME'] }}/{{ agag_agent_agent }}"
  tasks:
    - name: Require the agent name
      ansible.builtin.assert:
        that:
          - agag_agent_agent is defined
          - agag_agent_agent | length > 0
        fail_msg: set -e agag_agent_agent=<name>

    - name: Read whether the unit exists
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - "agag-{{ agag_agent_agent }}.service"
          - --property=LoadState
          - --value
      register: unit_load
      changed_when: false
      failed_when: unit_load.rc != 0 and unit_load.stdout | trim != 'not-found'

    - name: Stop and disable the agag agent listener
      ansible.builtin.systemd_service:
        name: "agag-{{ agag_agent_agent }}.service"
        state: stopped
        enabled: false
        scope: user
      when: unit_load.stdout | trim != 'not-found'

    - name: Remove the systemd user unit
      ansible.builtin.file:
        path: >-
          {{ ansible_facts['env']['HOME'] }}/.config/systemd/user/agag-{{ agag_agent_agent }}.service
        state: absent

    - name: Reload the user manager so the removed unit is forgotten
      ansible.builtin.systemd_service:
        daemon_reload: true
        scope: user

    - name: Read the remaining process state
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - "agag-{{ agag_agent_agent }}.service"
          - --property=LoadState,ActiveState,MainPID
      register: unit_state
      changed_when: false
      failed_when: unit_state.rc != 0 and 'LoadState=not-found' not in unit_state.stdout_lines

    - name: Confirm that the listener is no longer running
      ansible.builtin.assert:
        that:
          - "'MainPID=0' in unit_state.stdout_lines"
          - "'ActiveState=inactive' in unit_state.stdout_lines or 'ActiveState=failed' in unit_state.stdout_lines"
        fail_msg: "Listener retirement did not stop the unit: {{ unit_state.stdout }}"

    - name: Remove the agent checkout
      ansible.builtin.file:
        path: "{{ agag_agent_repo_dest }}"
        state: absent
      when: remove_checkout | bool

    - name: Report the stopped unit state
      ansible.builtin.debug:
        var: unit_state.stdout_lines
