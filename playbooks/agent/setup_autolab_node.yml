---
# Deploy/update the autolab job-runner node: agautolab checkout from GitHub
# plus the mission gateway (HTTP mission submission — no SSH on the request
# path). Use the rendered production inventory so placement-supplied provider
# and profile values reach the role:
#
#   ansible-playbook -i inventories/generated/production.yml \
#     playbooks/agent/setup_autolab_node.yml --limit agautolab1
#
- name: Install and update the autolab job-runner node
  hosts: autolab_nodes
  gather_facts: true
  become: false

  roles:
    - role: opencode_agent
      opencode_agent_serve: false
    - role: claude_code_agent
    - role: autolab_node
