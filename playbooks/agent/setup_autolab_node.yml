---
# Deploy/update the autolab job-runner node: agautolab checkout from gitea
# plus the mission gateway (HTTP mission submission — no SSH on the request
# path). Job-runner VMs are not in the generated production inventory yet
# (their DesiredNode is waiting_for_manual_initial_access), so runs use the
# local-only static inventory:
#
#   ansible-playbook -i inventories/agautolab.yml playbooks/agent/setup_autolab_node.yml
#
- name: Install and update the autolab job-runner node
  hosts: autolab_nodes
  gather_facts: true
  become: false

  roles:
    - role: autolab_node
