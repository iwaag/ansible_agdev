---
# Deploy/update the autolab job-runner node: agautolab checkout from GitHub
# plus the mission gateway (HTTP mission submission — no SSH on the request
# path). This bootstrap/update playbook intentionally keeps using its small
# static inventory so a broken production render cannot strand the agent
# maintenance path:
#
#   ansible-playbook -i inventories/agautolab.yml playbooks/agent/setup_autolab_node.yml
#
- name: Install and update the autolab job-runner node
  hosts: autolab_nodes
  gather_facts: true
  become: false

  roles:
    - role: autolab_node
